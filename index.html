<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>MSA Hub</title>
<style>
  :root { color-scheme: light; --navy:#112e51; --blue:#0071bb; --bg:#f1f3f6; --card:#fff; --line:#d6d7d9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:#212121; }
  header { background:var(--navy); color:#fff; padding:2rem 1rem; text-align:center; border-bottom:4px solid #fdb81e; }
  header h1 { margin:0 0 .25rem; font-size:2rem; }
  header p { margin:0; opacity:.85; }
  main { max-width:960px; margin:2rem auto; padding:0 1rem; }
  h2 { color:var(--navy); font-size:1.1rem; text-transform:uppercase; letter-spacing:.06em; margin:2rem 0 .75rem; border-bottom:2px solid var(--line); padding-bottom:.35rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:1rem; }
  a.card { display:flex; flex-direction:column; align-items:center; gap:.75rem; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1.5rem 1rem; text-decoration:none; color:var(--navy); text-align:center; transition:box-shadow .15s, transform .15s; }
  a.card:hover, a.card:focus { box-shadow:0 4px 12px rgba(0,0,0,.15); transform:translateY(-2px); outline:none; }
  a.card:focus-visible { outline:3px solid #fdb81e; }
  .card svg { width:64px; height:64px; }
  .card strong { font-size:1.05rem; }
  .sheet svg { color:#1d6f42; } .ppl svg { color:#7b3f98; } .sys svg { color:#0071bb; } .globe svg { color:#c25b00; } .shield svg { color:#112e51; }
  footer { text-align:center; font-size:.8rem; color:#5b616b; padding:2rem 1rem; }
</style>
</head>
