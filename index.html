<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSA Hub</title>
<style>
  :root{
    --va-blue:#112e51;
    --va-blue-mid:#205493;
    --va-gold:#fdb81e;
    --va-gray:#f1f1f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Source Sans Pro","Segoe UI",Arial,sans-serif;background:var(--va-gray);min-height:100vh}
  header{background:var(--va-blue);color:#fff;padding:2rem 1.5rem;border-bottom:6px solid var(--va-gold);text-align:center}
  header h1{font-size:2.2rem;letter-spacing:.5px}
  main{max-width:960px;margin:2.5rem auto;padding:0 1.25rem}
  h2{color:var(--va-blue);font-size:1.1rem;text-transform:uppercase;letter-spacing:1px;margin:0 0 1rem;border-left:5px solid var(--va-gold);padding-left:.7rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1.25rem;margin-bottom:2.5rem}
  a.box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:150px;padding:1.5rem;background:#fff;color:var(--va-blue);text-decoration:none;border-top:5px solid var(--va-blue-mid);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s,background .15s}
  a.box:hover,a.box:focus{background:var(--va-blue-mid);color:#fff;border-top-color:var(--va-gold);transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.2);outline:none}
  a.box:focus-visible{outline:3px solid var(--va-gold);outline-offset:2px}
  .ico{font-style:normal;font-size:2.4rem;margin-bottom:.5rem}
  .box strong{font-size:1.4rem}
</style>
</head>
<body>
<header>
  <h1>MSA Hub</h1>
</header>

<main>
  <h2>Documents</h2>
  <div class="grid">
    <a class="box" href="https://dvagov.sharepoint.com/:x:/s/PotsdamCBOCMSA/IQALgSTrOQ7ETYQokpeGZDPWAe_FwqHmdHPPB_t_je5uuOU?e=K3Sv7g" target="_blank" rel="noopener noreferrer">
      <i class="ico">📋</i><strong>MSA Tracker</strong>
    </a>
    <a class="box" href="https://dvagov.sharepoint.com/:x:/s/PotsdamCBOCMSA/IQCm_mzprd_XTY3T7ZeaNBrjARWGY-RJe2PrJewZRBrKWjY?e=PAQeHj" target="_blank" rel="noopener noreferrer">
      <i class="ico">📊</i><strong>GAP List</strong>
    </a>
  </div>

  <h2>Applications</h2>
  <div class="grid">
    <a class="box" href="https://staff.apps.va.gov/iss/" target="_blank" rel="noopener noreferrer">
      <i class="ico">🏥</i><strong>ISS</strong>
    </a>
    <a class="box" href="https://oitphcappctmv02.va.gov/pfs/login" target="_blank" rel="noopener noreferrer">
      <i class="ico">🖥️</i><strong>CTM</strong>
    </a>
  </div>
</main>
</body>
</html>
